<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRAFTHOST</title>
<style>
body{background:#101827;color:white;font-family:Arial;text-align:center;padding:25px}
.card{background:#1c293b;padding:24px;border-radius:15px;max-width:350px;margin:35px auto}
input,button{box-sizing:border-box;width:100%;padding:13px;margin:8px 0;border:0;border-radius:7px}
button{background:#4ade80;font-weight:bold}
p{color:#cbd5e1}
</style>
</head>
<body>
<h1>⛏ CRAFTHOST</h1>
<p>Your World. Your Server.</p>
<div class="card">
<h2 id="heading">Create Account</h2>
<form id="authForm">
<input id="email" type="email" placeholder="Email" required>
<input id="password" type="password" placeholder="Password (6+ characters)" minlength="6" required>
<button id="submitBtn">Sign Up</button>
</form>
<p id="message"></p>
<button id="switchBtn" type="button">Already have an account? Login</button>
<button id="logoutBtn" hidden>Logout</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const client = window.supabase.createClient(
  "https://tleiklvlzxgkqbdjnfns.supabase.co",
  "sb_publishable_zY9mHkixUxIUiE3H9BLfdg_m3acBAek"
);

let loginMode = false;
const form = document.getElementById("authForm");
const msg = document.getElementById("message");

document.getElementById("switchBtn").onclick = () => {
  loginMode = !loginMode;
  document.getElementById("heading").textContent =
    loginMode ? "Login" : "Create Account";
  document.getElementById("submitBtn").textContent =
    loginMode ? "Login" : "Sign Up";
  document.getElementById("switchBtn").textContent =
    loginMode ? "Create a new account" : "Already have an account? Login";
  msg.textContent = "";
};

form.onsubmit = async (e) => {
  e.preventDefault();
  msg.textContent = "Please wait...";
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const result = loginMode
    ? await client.auth.signInWithPassword({email, password})
    : await client.auth.signUp({
        email, password,
        options: {
          emailRedirectTo: "https://sangeeta9650.github.io/Crafthost/"
        }
      });

  if (result.error) {
    msg.textContent = result.error.message;
  } else if (loginMode) {
    msg.textContent = "Login successful!";
    showUser();
  } else {
    msg.textContent = result.data.session
      ? "Account created! You are logged in."
      : "Account created! Check your email to confirm.";
  }
};

async function showUser() {
  const {data} = await client.auth.getUser();
  if (data.user) {
    document.getElementById("heading").textContent = "Welcome!";
    msg.textContent = data.user.email;
    form.hidden = true;
    document.getElementById("switchBtn").hidden = true;
    document.getElementById("logoutBtn").hidden = false;
  }
}

document.getElementById("logoutBtn").onclick = async () => {
  await client.auth.signOut();
  location.reload();
};

client.auth.getSession().then(({data}) => {
  if (data.session) showUser();
});
</script>
</body>
</html>
