
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRAFTHOST</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090b12;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh;padding:20px}
.card{width:100%;max-width:420px;background:#151925;border:1px solid #30394d;border-radius:18px;padding:25px}
h1{color:#a78bfa;text-align:center;margin-top:0}
p{text-align:center;color:#aeb7ca}
label{display:block;margin:18px 0 8px}
input{width:100%;padding:14px;border-radius:9px;border:1px solid #414b60;background:#090d17;color:white;font-size:16px}
.address{display:flex;align-items:center;gap:7px}
.address span{color:#a78bfa;font-weight:bold}
button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:9px;background:#8b5cf6;color:white;font-size:16px;font-weight:bold}
#status{overflow-wrap:anywhere;font-size:14px}
</style>
</head>
<body>
<main class="card">
<h1>CRAFTHOST</h1>
<p>Create your Minecraft server</p>

<label for="serverName">Server Name</label>
<input id="serverName" value="BURGER SMP" maxlength="30">

<label for="address">Server Address</label>
<div class="address">
<input id="address" value="burgersmp" maxlength="30">
<span>.net</span>
</div>

<button id="create">Create Server</button>
<p id="status" role="status"></p>
</main>

<script>
const API = "https://crafthost.sangeetakumari56866.workers.dev";
const button = document.getElementById("create");
const statusBox = document.getElementById("status");

button.addEventListener("click", async () => {
  const name = document.getElementById("serverName").value.trim();
  const subdomain = document.getElementById("address").value.trim().toLowerCase();

  if (!name || !/^[a-z0-9-]{3,30}$/.test(subdomain)) {
    statusBox.textContent = "Enter a server name and an address using 3–30 letters, numbers or hyphens.";
    return;
  }

  let code = sessionStorage.getItem("crafthost_code");
  if (!code) {
    code = prompt("Enter your CRAFTHOST access code:");
    if (!code) return;
    sessionStorage.setItem("crafthost_code", code);
  }

  button.disabled = true;
  button.textContent = "Creating...";
  statusBox.textContent = "Connecting to server host...";

  try {
    const response = await fetch(API + "/api/servers", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-CRAFTHOST-ACCESS-CODE": code
      },
      body: JSON.stringify({ name, subdomain })
    });

    const data = await response.json();
    if (!response.ok) {
      if (response.status === 401 || response.status === 403) {
        sessionStorage.removeItem("crafthost_code");
      }
      throw new Error(data.message || data.error || "Request failed (" + response.status + ")");
    }

    statusBox.textContent = JSON.stringify(data);
  } catch (error) {
    statusBox.textContent = "Error: " + error.message;
  } finally {
    button.disabled = false;
    button.textContent = "Create Server";
  }
});
</script>
</body>
</html>
