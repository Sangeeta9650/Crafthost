
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRAFTHOST</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0d12;color:white;font-family:Arial,sans-serif}
header{padding:20px;background:#141821;border-bottom:1px solid #292e3a}
h1{margin:0;color:#8b7cff}
main{max-width:850px;margin:30px auto;padding:16px}
.card{background:#151923;padding:20px;border-radius:14px;margin-bottom:18px;border:1px solid #292e3a}
button,select,input{padding:12px;border-radius:8px;border:0;margin:5px 0;font-size:15px}
button{background:#7867ff;color:white;font-weight:bold;cursor:pointer}
input,select{background:#242a37;color:white;width:100%}
button:disabled{opacity:.5}
.status{color:#ffcf70}
</style>
</head>
<body>
<header><h1>CRAFTHOST</h1><p>Free Minecraft Server Panel</p></header>
<main>
<div class="card">
<h2>Create your server</h2>
<label>Server name</label>
<input id="name" placeholder="My Minecraft Server">
<label>Edition</label>
<select id="edition">
<option value="java">Java Edition</option>
<option value="bedrock">Bedrock Edition</option>
</select>
<button onclick="createServer()">Create Server</button>
<p id="message" class="status">Hosting API is not connected yet.</p>
</div>
<div class="card">
<h2>My Server</h2>
<p id="serverName">No server created</p>
<p id="serverStatus">Status: Not connected</p>
<p id="serverIP">IP: Not available</p>
<button onclick="alert('Falix API backend connection required.')">Start</button>
<button onclick="alert('Falix API backend connection required.')">Stop</button>
<button onclick="alert('Falix API backend connection required.')">Restart</button>
</div>
</main>
<script>
function createServer(){
 const name=document.getElementById('name').value.trim();
 const edition=document.getElementById('edition').value;
 if(!name){
  document.getElementById('message').textContent='Please enter a server name.';
  return;
 }
 document.getElementById('serverName').textContent=name+' ('+edition+')';
 document.getElementById('serverStatus').textContent='Status: Hosting API not connected';
 document.getElementById('serverIP').textContent='IP: Not available yet';
 document.getElementById('message').textContent='Dashboard created. Real hosting connection is still required.';
}
</script>
</body>
</html>
