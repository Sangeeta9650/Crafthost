
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRAFTHOST</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#070914;color:#f7f7ff;font-family:Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:430px;background:#111426;border:1px solid #292e4a;border-radius:22px;padding:25px}
.logo{font-size:27px;font-weight:800;margin-bottom:10px}
.logo span{color:#a783ff}
.tagline{color:#a7adc5;font-size:14px;margin-bottom:35px}
h2{font-size:24px;margin-bottom:25px}
label{display:block;margin:18px 0 9px;color:#c8cce0;font-size:14px}
input{width:100%;padding:15px;border-radius:11px;border:1px solid #363d5d;background:#080b18;color:white;font-size:16px}
.address{display:flex;align-items:center;border:1px solid #363d5d;background:#080b18;border-radius:11px;padding-right:14px}
.address input{border:0;min-width:0}
.address span{color:#b8a1ff;font-weight:bold}
button{width:100%;padding:16px;margin-top:25px;border:0;border-radius:12px;background:linear-gradient(100deg,#773cff,#167dff);color:white;font-size:17px;font-weight:bold}
button:disabled{opacity:.6}
#message{margin-top:18px;line-height:1.5;overflow-wrap:anywhere;font-size:14px}
.note{color:#9098b4;font-size:12px;line-height:1.5;margin-top:25px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">◇ CRAFT<span>HOST</span></div>
  <div class="tagline">Your server. Your world.</div>
  <h2>Create Your Server</h2>

  <form id="form">
    <label for="name">Server Name</label>
    <input id="name" value="BURGER SMP" required minlength="3" maxlength="20">

    <label for="subdomain">Server Address</label>
    <div class="address">
      <input id="subdomain" value="burgersmp" required
       pattern="[a-z0-9]+(-[a-z0-9]+)*" maxlength="30">
      <span>.net</span>
    </div>

    <button id="create" type="submit">＋ Create Server</button>
  </form>

  <div id="message" role="status"></div>
  <div class="note">Your server, your world. Server address availability depends on domain ownership and hosting support.</div>
</div>

<script>
const API="https://crafthost.sangeetakumari56866.workers.dev";
const form=document.getElementById("form");
const button=document.getElementById("create");
const message=document.getElementById("message");

form.addEventListener("submit",async e=>{
  e.preventDefault();

  // Access code is requested privately when needed; never hardcode it.
  const accessCode=prompt("Enter your CRAFTHOST access code:");
  if(!accessCode)return;

  button.disabled=true;
  message.textContent="Connecting to CRAFTHOST…";

  try{
    const response=await fetch(API+"/api/servers",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "X-CRAFTHOST-ACCESS-CODE":accessCode
      },
      body:JSON.stringify({
        name:document.getElementById("name").value.trim(),
        subdomain:document.getElementById("subdomain").value.trim()
      })
    });

    const data=await response.json();
    if(!response.ok){
      const err=data.error||data;
      message.textContent="Unable to create server: "+
        (err.message||err.code||JSON.stringify(err));
      return;
    }

    message.textContent="Request sent to hosting provider: "+JSON.stringify(data);
  }catch(err){
    message.textContent="Connection failed. Cloudflare Worker ko check karo.";
  }finally{
    button.disabled=false;
  }
});
</script>
</body>
</html>
