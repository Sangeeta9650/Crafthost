
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRAFTHOST</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#090a12;color:#f7f7ff;
font-family:Arial,sans-serif;display:grid;place-items:center;padding:20px}
main{width:100%;max-width:430px;background:#121421;border:1px solid #292d43;
border-radius:22px;padding:25px;box-shadow:0 20px 70px #0008}
.brand{font-size:25px;font-weight:800;letter-spacing:1px}
.brand span{color:#9b7bff}
.sub{color:#9da3b8;margin:8px 0 28px;font-size:14px}
h2{font-size:21px;margin:0 0 22px}
label{display:block;color:#c7cbe0;font-size:13px;margin:16px 0 8px}
input{width:100%;background:#090b14;color:white;border:1px solid #343951;
border-radius:11px;padding:14px;font-size:16px;outline:none}
input:focus{border-color:#9b7bff}
.address{display:flex;align-items:center;background:#090b14;
border:1px solid #343951;border-radius:11px;padding-right:13px}
.address input{border:0;min-width:0}
.address b{color:#b6a3ff;white-space:nowrap}
button{width:100%;margin-top:23px;border:0;border-radius:11px;
padding:15px;background:linear-gradient(100deg,#7357f5,#a34dff);
color:white;font-size:16px;font-weight:700}
button:disabled{opacity:.55}
#message{font-size:14px;line-height:1.5;overflow-wrap:anywhere;margin-top:17px}
.muted{color:#939ab0;font-size:12px;line-height:1.5;margin-top:22px}
</style>
</head>
<body>
<main>
  <div class="brand">◇ CRAFT<span>HOST</span></div>
  <p class="sub">Your server. Your world.</p>
  <h2>Create your Minecraft server</h2>

  <form id="createForm">
    <label for="serverName">Server name</label>
    <input id="serverName" value="BURGER SMP" minlength="3"
      maxlength="20" required>

    <label for="address">Server address</label>
    <div class="address">
      <input id="address" value="burgersmp" maxlength="20"
        pattern="[a-z0-9]+(-[a-z0-9]+)*" required>
      <b>.net</b>
    </div>

    <label for="accessCode">Your CRAFTHOST access code</label>
    <input id="accessCode" type="password" autocomplete="off"
      placeholder="Enter your access code" required>

    <button id="createButton" type="submit">Create Server</button>
  </form>

  <div id="message" role="status"></div>
  <p class="muted">Free server availability and addresses depend on
  the hosting provider. A .net address works only when it is supported
  and correctly connected to your server.</p>
</main>

<script>
const API = "https://crafthost.sangeetakumari56866.workers.dev";
const form = document.getElementById("createForm");
const button = document.getElementById("createButton");
const message = document.getElementById("message");

form.addEventListener("submit", async event => {
  event.preventDefault();
  button.disabled = true;
  message.textContent = "Creating your server request…";

  try {
    const response = await fetch(API + "/api/servers", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-CRAFTHOST-ACCESS-CODE":
          document.getElementById("accessCode").value
      },
      body: JSON.stringify({
        name: document.getElementById("serverName").value.trim(),
        subdomain: document.getElementById("address").value.trim()
      })
    });

    const data = await response.json();
    if (!response.ok) {
      const error = data.error || data;
      if (error.action_url) {
        message.textContent = "Hosting approval required. Open the approval link: " +
          error.action_url;
      } else {
        message.textContent = "Error: " +
          (error.message || error.code || JSON.stringify(error));
      }
      return;
    }

    const jobId = data.data?.job_id || data.job_id;
    if (jobId) {
      message.textContent = "Request accepted! Checking server creation…";
      for (let i = 0; i < 12; i++) {
        await new Promise(resolve => setTimeout(resolve, 2500));
        const statusResponse = await fetch(
          API + "/api/create-jobs/" + encodeURIComponent(jobId),
          { headers: {
            "X-CRAFTHOST-ACCESS-CODE":
              document.getElementById("accessCode").value
          }}
        );
        const statusData = await statusResponse.json();
        if (!statusResponse.ok) {
          message.textContent = "Request accepted. Job status check failed: " +
            JSON.stringify(statusData);
          return;
        }
        const job = statusData.data || statusData;
        if (job.state === "ready" || job.state === "completed") {
          message.textContent = "Server created! Open your Falix dashboard to see its real connection address.";
          return;
        }
        if (job.state === "failed") {
          message.textContent = "Server creation failed: " +
            JSON.stringify(job.errors || job.message || job);
          return;
        }
      }
      message.textContent = "Server request is still processing. Check Falix dashboard shortly.";
    } else {
      message.textContent = "Response received: " + JSON.stringify(data);
    }
  } catch (error) {
    message.textContent = "Connection failed. Check the Cloudflare Worker and its logs.";
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
