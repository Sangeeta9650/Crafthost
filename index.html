
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRAFTHOST | Minecraft Hosting</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #090914;
      color: #f4f4ff;
      font-family: Arial, sans-serif;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    main {
      width: 100%;
      max-width: 480px;
      padding: 28px;
      background: #141426;
      border: 1px solid #34345b;
      border-radius: 20px;
      box-shadow: 0 0 35px #5d35ff22;
    }
    h1 { color: #9d8aff; margin-top: 0; }
    p { color: #b8b8d2; }
    label { display: block; margin: 18px 0 8px; }
    input {
      width: 100%;
      padding: 13px;
      background: #090914;
      border: 1px solid #45456b;
      border-radius: 9px;
      color: white;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #7961ff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: #d9d5ff;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <h1>⚡ CRAFTHOST</h1>
    <p>Create your Minecraft server</p>

    <form id="serverForm">
      <label for="name">Server Name</label>
      <input id="name" value="BURGER SMP"
             minlength="3" maxlength="20" required>

      <label for="subdomain">Server Address</label>
      <input id="subdomain" value="burgersmp"
             minlength="1" maxlength="20"
             pattern="[a-z0-9]+(-[a-z0-9]+)*" required>

      <button id="createButton" type="submit">Create Server</button>
    </form>

    <pre id="result" aria-live="polite"></pre>
  </main>

  <script>
    const API =
      "https://crafthost.sangeetakumari56866.workers.dev";

    const form = document.getElementById("serverForm");
    const button = document.getElementById("createButton");
    const result = document.getElementById("result");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const accessCode = prompt("Enter your CRAFTHOST access code");
      if (!accessCode) return;

      button.disabled = true;
      result.textContent = "Checking connection...";

      try {
        const response = await fetch(API + "/api/servers", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-CRAFTHOST-ACCESS-CODE": accessCode
          },
          body: JSON.stringify({
            name: document.getElementById("name").value.trim(),
            subdomain: document.getElementById("subdomain").value.trim()
          })
        });

        const data = await response.json().catch(() => ({
          error: "Server returned an unreadable response."
        }));

        result.textContent =
          "HTTP " + response.status + "\n" +
          JSON.stringify(data, null, 2);
      } catch (error) {
        result.textContent =
          "Connection error: " + error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
